aws_snowflake_dbt_project:
  outputs:
    dev:
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      database: database_name
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: role
      schema: schema
      threads: 1
      type: snowflake
      user: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      warehouse: warehouse_name
  target: dev
